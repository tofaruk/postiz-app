# No Time German's own Postiz image for the Oracle VM (ARM).
# Push a tag like v2.25.3-ntg.1 on the notimegerman branch:
# this builds ghcr.io/<owner>/postiz-app:<tag> for linux/arm64.
# No `latest`: the VM always names the exact tag.
name: "Build No Time German image"

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-ntg.*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    # GitHub's free ARM runner builds natively.
    runs-on: ubuntu-24.04-arm
    env:
      TAG: ${{ github.ref_name }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        run: |
          IMAGE="ghcr.io/${OWNER,,}/postiz-app:${TAG}"
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION="$TAG" \
            --pull \
            --provenance=false \
            --sbom=false \
            -t "$IMAGE" \
            --push .
          docker buildx imagetools inspect "$IMAGE"
